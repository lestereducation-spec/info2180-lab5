<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Database Lookup</title>
    <link rel="stylesheet" href="world.css">
    <script src="world.js" defer></script>
</head>
<body>
    <header>
        <h1>World Database Lookup</h1>
    </header>

    <main>
        <form id="controls">
            <label for="country">Country:</label>
            <input id="country" type="search" name="country" placeholder="Enter country name">
            <button id="lookup" type="submit">Lookup</button>
        </form>

        <div id="result" aria-live="polite"></div>
    </main>
</body>
</html>
